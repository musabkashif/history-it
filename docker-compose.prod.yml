# Production stack for one Ubuntu host: Nginx (UI + reverse proxy) + FastAPI.
# Backend port 8000 is not published to the host.
#
# Prerequisites on the host (gitignored; transfer separately):
#   .env                          from .env.production.example
#   server/credentials/*.json     Google service account
#   server/governing/             governing DOCX packet
#
# Build & start:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: historyit-api:prod
    env_file:
      - path: .env
        required: false
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
      GOVERNING_DOCS_DIR: /service/governing
      DIAGNOSTICS_DIR: /service/logs
      PROJECT_REFERENCES_DIR: /service/project_references
    volumes:
      - ./server/credentials:/run/secrets:ro
      - ./server/governing:/service/governing:ro
      - ./server/logs:/service/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Empty = same-origin browser requests (overrides any localhost value).
        VITE_API_BASE_URL: ""
        # Optional. Visible in the built JS bundle; protect the host accordingly.
        VITE_API_TOKEN: ${VITE_API_TOKEN:-}
    image: historyit-web:prod
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
