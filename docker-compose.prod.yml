# Production stack: Nginx (HTTPS UI + reverse proxy) + one FastAPI worker.
# Backend port 8000 is not published to the host.
#
# Prerequisites on the host (gitignored; transfer separately):
#   .env                          from .env.production.example
#   server/credentials/*.json     Google service account
#   server/governing/             governing DOCX packet
#   PUBLIC_IPV4 Elastic IP        see deploy/PUBLIC_ACCESS.md
#
# Certificate bootstrap (no app on HTTP):
#   docker compose -f docker-compose.prod.yml -f docker-compose.bootstrap.yml up -d
#   ./deploy/scripts/bootstrap-cert.sh
#
# Full HTTPS start:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: historyit-api:prod
    env_file:
      - path: .env
        required: false
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
      GOVERNING_DOCS_DIR: /service/governing
      DIAGNOSTICS_DIR: /service/logs
      PROJECT_REFERENCES_DIR: /service/project_references
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - ./server/credentials:/run/secrets:ro
      - ./server/governing:/service/governing:ro
      - ./server/logs:/service/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Empty = same-origin browser requests (overrides any localhost value).
        VITE_API_BASE_URL: ""
    image: historyit-web:prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # One-shot / renew helper. Use: docker compose --profile certs run --rm --entrypoint certbot certbot ...
  certbot:
    image: certbot/certbot:v5.4.0
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    profiles: ["certs"]
    restart: "no"

volumes:
  certbot_www:
  certbot_certs:
