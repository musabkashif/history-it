# HTTP-only bootstrap: ACME challenges only. No app UI and no API proxy.
# Use while obtaining the first Let's Encrypt IP certificate.

server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 503 'Certificate bootstrap in progress';
    }
}
