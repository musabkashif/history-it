# Overlay: expose only ACME HTTP challenge endpoints while obtaining certificates.
# Does not serve the SPA or proxy /api (no login over plain HTTP).
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.bootstrap.yml up -d --no-deps web
#   ./deploy/scripts/bootstrap-cert.sh

services:
  web:
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:rw
      - certbot_certs:/etc/letsencrypt:ro
